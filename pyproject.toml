[project]
name = "leadfinder"
version = "0.1.0"
description = "Find local business leads, by city, using the Google Places API"
readme = "README.md"
authors = [
    { name = "Iago Ferreira", email = "iago-ferreira@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
leadfinder = "leadfinder:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
